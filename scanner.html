<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17263d">
<title>Makro Barcode Scanner</title>
<style>
:root{color-scheme:light;--navy:#17263d;--blue:#1976d2;--muted:#66778b;--line:#dce4ed}
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#1c2b3a;font:15px/1.45 Arial,Helvetica,sans-serif}
.shell{max-width:760px;margin:0 auto;padding:20px}
header{background:var(--navy);color:white;padding:20px 22px;border-radius:14px 14px 0 0}
header strong{font-size:20px;display:block}header span{font-size:13px;color:#c9d7e6}
main{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:18px}
.status{padding:12px 14px;background:#eef4fb;border-radius:9px;color:#355a80;margin-bottom:14px}
.video-wrap{background:#101820;border-radius:12px;overflow:hidden;position:relative;min-height:240px;display:flex;align-items:center;justify-content:center}
video{display:block;width:100%;max-height:70vh;object-fit:cover}
.scan-frame{position:absolute;left:8%;right:8%;top:35%;height:30%;border:2px solid #31d28a;border-radius:10px;box-shadow:0 0 0 999px #0002;pointer-events:none}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:13px 18px;font-weight:700;font-size:14px;cursor:pointer}
.primary{background:var(--blue);color:white}.secondary{background:#edf2f7;color:#26384c}
button:disabled{opacity:.55;cursor:wait}
.help{font-size:12px;color:var(--muted);margin:13px 0 0}
.result{font-size:18px;font-weight:700;word-break:break-all;background:#eff8f2;color:#1e754b;padding:12px;border-radius:9px;margin-top:14px}
@media(max-width:600px){.shell{padding:0}.video-wrap{min-height:55vh}header,main{border-radius:0}main{min-height:calc(100vh - 82px)}.actions button{flex:1}}
</style>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
</head>
<body>
<div class="shell">
  <header><strong>Makro Barcode Scanner</strong><span id="targetLabel">Preparing camera…</span></header>
  <main>
    <div class="status" id="status">Requesting camera permission. Please allow camera access when your browser asks.</div>
    <div class="video-wrap">
      <video id="camera" autoplay muted playsinline></video>
      <div class="scan-frame"></div>
    </div>
    <div class="actions">
      <button class="primary" id="restartBtn" type="button" onclick="startCamera()">Start camera</button>
      <button class="secondary" type="button" onclick="cancelScanner()">Cancel</button>
    </div>
    <div class="help">Hold the barcode steady inside the green frame. The scanner will return the first valid result to your Expiry Management page.</div>
    <div class="result" id="result" hidden></div>
  </main>
</div>
<script>
(function(){
  "use strict";
  const params=new URLSearchParams(location.search);
  const token=params.get("token")||"";
  const target=params.get("target")==="expiry" ? "expiry" : "product";
  const video=document.getElementById("camera");
  const status=document.getElementById("status");
  const restartBtn=document.getElementById("restartBtn");
  const resultBox=document.getElementById("result");
  let reader=null, controls=null, finished=false, starting=false;

  document.getElementById("targetLabel").textContent =
    target==="expiry" ? "Expiry Upload · Scan item barcode" : "Product Search · Scan barcode or item code";

  function setStatus(message,isError){
    status.textContent=message;
    status.style.background=isError?"#fff0f0":"#eef4fb";
    status.style.color=isError?"#a52d2d":"#355a80";
  }

  function sendToApp(type,extra){
    if(!window.opener || window.opener.closed){
      setStatus("The original application window is no longer available. Please reopen Camera Scan from the application.",true);
      return false;
    }
    window.opener.postMessage(Object.assign({type,token},extra||{}),"*");
    return true;
  }

  function buildReader(){
    if(!window.ZXing || !ZXing.BrowserMultiFormatReader){
      throw new Error("Barcode decoding library failed to load. Check your internet connection and reload this page.");
    }
    const hints=new Map();
    const names=["UPC_A","UPC_E","EAN_8","EAN_13","CODE_128","CODE_39","ITF","CODABAR","QR_CODE","DATA_MATRIX","PDF_417","AZTEC"];
    const formats=names.map(name=>ZXing.BarcodeFormat && ZXing.BarcodeFormat[name]).filter(v=>v!==undefined);
    if(ZXing.DecodeHintType && ZXing.DecodeHintType.POSSIBLE_FORMATS && formats.length){
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,formats);
    }
    if(ZXing.DecodeHintType && ZXing.DecodeHintType.TRY_HARDER){
      hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    }
    return new ZXing.BrowserMultiFormatReader(hints,200);
  }

  async function startCamera(){
    if(finished || starting) return;
    starting=true;
    restartBtn.disabled=true;
    setStatus("Opening camera… allow camera permission if prompted.");
    try{
      if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        throw new Error("Camera requires a secure HTTPS page and a browser that supports camera access.");
      }
      reader=buildReader();
      // "ideal" selects the rear camera on phones and falls back to the default webcam on laptops.
      controls=await reader.decodeFromConstraints({
        audio:false,
        video:{
          facingMode:{ideal:"environment"},
          width:{ideal:1280},
          height:{ideal:720}
        }
      },video,(scan,error)=>{
        if(finished || !scan || !scan.getText) return;
        const value=String(scan.getText()||"").trim();
        if(!value) return;
        finished=true;
        resultBox.hidden=false;
        resultBox.textContent="Scanned: "+value;
        setStatus("Barcode recognized. Returning the value to Expiry Management…");
        stopCamera();
        const sent=sendToApp("MAKRO_BARCODE_RESULT",{value});
        if(sent) setTimeout(()=>window.close(),350);
      });
      if(!finished) setStatus("Camera is active. Position the barcode inside the green frame.");
    }catch(error){
      const message=error && error.message ? error.message : String(error);
      let friendly=message;
      if(error && error.name==="NotAllowedError") friendly="Camera permission was denied. Allow camera access for this HTTPS scanner site in your browser settings, then click Start camera.";
      else if(error && error.name==="NotFoundError") friendly="No camera was found. Connect a webcam or use a phone with a rear camera.";
      else if(error && error.name==="NotReadableError") friendly="The camera is busy in another application. Close other apps using the camera and try again.";
      setStatus(friendly,true);
      sendToApp("MAKRO_BARCODE_ERROR",{message:friendly});
    }finally{
      starting=false;
      restartBtn.disabled=false;
    }
  }

  function stopCamera(){
    try{if(controls && controls.stop) controls.stop();}catch(e){}
    try{if(reader) reader.reset();}catch(e){}
    controls=null;reader=null;
    if(video.srcObject){
      video.srcObject.getTracks().forEach(track=>track.stop());
      video.srcObject=null;
    }
  }

  function cancelScanner(){
    if(!finished) sendToApp("MAKRO_BARCODE_CANCEL");
    finished=true;
    stopCamera();
    window.close();
  }

  window.startCamera=startCamera;
  window.cancelScanner=cancelScanner;
  window.addEventListener("beforeunload",()=>{stopCamera();});
  window.addEventListener("load",()=>{startCamera();});
})();
</script>
</body>
</html>
